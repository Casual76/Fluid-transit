# Fluid Transit — Worker di probe (Fase 1, spike 1)
#
# Scopo unico: stabilire se l'origine della Regione Toscana risponde a una
# richiesta proveniente dalla rete Cloudflare. Se blocca gli IP datacenter,
# l'intero design del proxy descritto nel piano non sta in piedi e va
# ripensato prima di scrivere qualsiasi codice di prodotto.
#
# Questo Worker e' usa-e-getta: in Fase 4 lo stesso pacchetto diventa il
# proxy vero (cron + R2 + Durable Object RtHub).

name = "fluid-transit-probe"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Nessun binding: la probe non scrive niente, non ha stato, non costa R2.
