# Fluid Transit — proxy realtime (Fase 4).
#
# Cron al minuto: fetch dei tre feed GTFS-RT, parse col decoder statico,
# snapshot binario su R2. Richieste: byte gia' pronti dietro la Cache API.
# La probe di Fase 1 e' stata sostituita da questo Worker; il vecchio
# `fluid-transit-probe` resta deployato ma inerte (nessun cron, zero costi).

name = "fluid-transit-rt"
main = "src/index.js"
compatibility_date = "2026-01-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[r2_buckets]]
binding = "RT"
bucket_name = "fluid-transit-rt"
