name: RT keepalive

# Il piano B della Fase 1, attivato per necessita': il Cron Trigger di
# Cloudflare risulta registrato (verificato via API, riscritto, cancellato e
# ricreato) ma non e' MAI scattato. Nel frattempo il proxy si tiene fresco da
# solo col refresh pigro a ogni lettura; questo cron copre il caso rimasto
# scoperto — il primo utente dopo un periodo di quiete, che altrimenti
# vedrebbe posizioni vecchie per un giro di poll.
#
# GitHub non garantisce la puntualita' dei cron, e su questo repo la
# differenza fra la pianificazione e la realta' e' enorme. Misurato il
# 16/09/2026 sui run veri: questo cron chiede di girare ogni cinque minuti e
# gli ultimi quattro avvii sono stati alle 05:57, 01:09, 23:00 e 20:28 —
# cioe' uno ogni due o cinque ore, con il 98% delle occorrenze semplicemente
# saltate. Nello stesso giorno il bundle notturno, che chiede le 03:40 UTC,
# e' partito alle 08:49; il giorno prima alle 08:57. Non sono ritardi di
# minuti: sono ore, e la maggior parte degli avvii non avviene affatto.
#
# Quindi: come rete di sicurezza ogni tanto va bene, come metronomo no —
# e nessun conto sulla freschezza deve dipendere da qui. Se un giorno il
# cron di Cloudflare si sveglia, /rt/v1/health mostrera' il campo `cron` e
# questo workflow si potra' spegnere.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: rt-keepalive
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # La chiave viaggia in un header, non nella query: l'URL finisce nei log
      # di Actions, l'header no. Se il secret non e' configurato la variabile e'
      # vuota, non si manda nessun header, e il Worker — che a sua volta lascia
      # passare finche' REFRESH_SECRET non c'e' — risponde lo stesso: cosi' il
      # keepalive non si rompe nell'intervallo fra questo deploy e la messa in
      # opera del segreto.
      - name: Un giro di refresh
        env:
          REFRESH_KEY: ${{ secrets.RT_REFRESH_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 60 ${REFRESH_KEY:+-H "x-refresh-key: $REFRESH_KEY"} "https://fluid-transit-rt.fluid-transit.workers.dev/rt/v1/refresh"
          echo
