name: Deploy Worker

# Il deploy passa da qui e non dalla macchina di sviluppo
# per un motivo pratico: e' l'unico percorso di pubblicazione, riproducibile,
# con le credenziali gia' nei secret del repo.
#
# I test, invece, girano anche in locale: `npm test` dentro worker/. Sono
# senza dipendenze (node --test) e senza rete.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Il Worker parla con l'app byte per byte e con l'origine sul wire format
  # protobuf: due contratti che non perdonano, e fino a qui senza un solo
  # controllo. Se questi cadono, non si pubblica.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        working-directory: worker
        run: npm test

  deploy:
    needs: test
    # Su una PR si controlla e basta: pubblicare da un ramo non e' mai giusto.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Il submodule engine/ non serve al Worker.
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa wrangler
        run: npm install --no-save wrangler@4

      - name: Deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: URL pubblicato
        run: |
          echo "### Worker pubblicato" >> "$GITHUB_STEP_SUMMARY"
          echo '`https://fluid-transit-rt.fluid-transit.workers.dev`' >> "$GITHUB_STEP_SUMMARY"
