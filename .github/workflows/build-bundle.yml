# Il bundle orari, ogni notte.
#
# La Regione rigenera il feed verso le 04:00 italiane; il job parte alle
# 03:40 UTC (05:40 in estate, 04:40 in inverno), a feed fresco in entrambi i
# casi. La catena e': scarica -> costruisci -> verifica contro i CSV ->
# gate volumetrici contro il build precedente -> pubblica sulla release
# `dati` -> aggiorna index.json per ultimo, che e' lo switch atomico.
#
# Se un gate fallisce non si pubblica niente: l'app continua a scaricare il
# bundle di ieri, che e' esattamente il comportamento voluto.
name: Bundle orari

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      ignora_gate:
        description: >-
          Pubblica anche se i gate volumetrici protestano. Da usare SOLO dopo
          aver guardato i numeri nel log e aver capito perche' sono cambiati.
        type: boolean
        default: false

permissions:
  contents: write # per la release `dati`

concurrency:
  group: build-bundle
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-latest
    # Novanta minuti, non sessanta.
    #
    # Il lavoro vero misurato dura circa mezz'ora e lo scarico del feed
    # poco piu' di cinque minuti, quindi sessanta sembravano larghi. Ma i
    # tentativi di curl, sommati, potevano da soli sfiorare l'ora: il 16/09
    # la sorgente e' andata lenta e il job e' rimasto nello scarico per
    # piu' di cinquanta minuti, per poi essere ucciso dal timeout senza
    # aver costruito niente. Adesso il tetto dello scarico e' molto piu'
    # stretto (sotto) e quello del job piu' largo: se la sorgente e' lenta
    # si fallisce presto e con un motivo, invece di morire a meta' strada.
    timeout-minutes: 90
    steps:
      # Senza submodule: al bundler servono solo :core-routing e :bundler,
      # e il settings.gradle esclude :app quando l'engine non c'e'.
      - uses: actions/checkout@v4
        with:
          submodules: false

      # Parte per primo e lavora in background: il grafo stradale della
      # Toscana si costruisce mentre bundle e verifica girano. Serve al map
      # matching delle tratte (le shape GTFS sono tracce GPS: zoomate
      # tagliano gli isolati; riproiettate sul grafo OSM seguono l'asfalto).
      - name: Avvia Valhalla in background (grafo stradale Toscana)
        run: |
          set -euo pipefail
          # -L: Geofabrik puo' rispondere con un redirect al mirror, e senza
          # seguirlo il "pbf" scaricato e' la paginetta del 302.
          curl --fail --silent --show-error --location \
               --retry 3 --retry-delay 20 \
               --max-time 900 -o /tmp/centro.osm.pbf \
               "https://download.geofabrik.de/europe/italy/centro-latest.osm.pbf"
          test "$(stat -c%s /tmp/centro.osm.pbf)" -gt 100000000 || {
            echo "::error::il pbf del Centro Italia e' sospettosamente piccolo"; exit 1; }
          sudo apt-get update -qq
          sudo apt-get install -y -qq osmium-tool >/dev/null
          # Il ritaglio: Geofabrik non ha la sola Toscana, il Centro intero
          # triplicherebbe il tempo di costruzione del grafo.
          osmium extract --bbox 9.55,42.20,12.60,44.60 /tmp/centro.osm.pbf \
                 -o /tmp/toscana.osm.pbf --overwrite
          ls -la /tmp/toscana.osm.pbf
          mkdir -p /tmp/valhalla
          cp /tmp/toscana.osm.pbf /tmp/valhalla/
          docker run -d --name valhalla -p 8002:8002 \
            -v /tmp/valhalla:/custom_files \
            -e serve_tiles=True -e build_admins=False -e build_time_zones=False \
            ghcr.io/gis-ops/docker-valhalla/valhalla:latest

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Scarica il feed GTFS
        run: |
          set -euo pipefail
          # Il server non supporta Range (verificato in Fase 1): un download
          # interrotto riparte da zero, quindi --retry sull'intero file.
          #
          # I numeri vengono da una misura: in un giro sano questo passo dura
          # cinque minuti e ventitre' secondi. Dieci minuti per tentativo sono
          # il doppio abbondante, e tre tentativi in tutto fanno al massimo
          # una mezz'ora: sta nel budget del job insieme al resto. Con
          # --retry 4 e --max-time 900, com'era prima, il solo scarico poteva
          # arrivare a sessantuno minuti — piu' del tetto dell'intero job,
          # cioe' non poteva fallire in tempo per lasciar lavorare il resto.
          curl --fail --silent --show-error \
               --retry 2 --retry-delay 20 --retry-all-errors \
               --max-time 600 \
               -A "FluidTransit-Bundler/0.1 (+https://github.com/Casual76/Fluid-transit)" \
               -o gtfs.zip \
               "https://regionetoscana.smartregion.toscana.it/mobility/artifacts/gtfs"
          # Gate 1, integrita': e' uno zip vero?
          head -c 4 gtfs.zip | od -An -tx1 | grep -q "50 4b 03 04" || {
            echo "::error::il feed scaricato non e' uno zip"; exit 1; }
          mkdir -p work/gtfs
          unzip -q gtfs.zip -d work/gtfs
          ls -la work/gtfs

      # Il map matching, una volta sola e prima di tutto il resto.
      #
      # Fino alla Fase 8 viveva dentro il passo dell'overlay: le tratte
      # DISEGNATE seguivano l'asfalto, ma la geometria dentro il bundle
      # restava la traccia GPS grezza. Da quando i bus vivi ci corrono sopra
      # non basta piu' — un mezzo che avanza su una traccia GPS taglia gli
      # isolati. Ora il risultato e' un sidecar che leggono entrambi.
      #
      # Il bundle aspetta il grafo, ma non costa niente: dura tre secondi e
      # il cammino critico e' Valhalla comunque.
      - name: Riproietta le shape sulla strada (Valhalla)
        run: |
          set -euo pipefail
          # Se il grafo non e' pronto in tempo si va senza: meglio le tratte
          # GPS di ieri che nessuna pubblicazione — e la revisione
          # dell'overlay resta bassa, cosi' domani si riprova.
          # La sonda interroga CINQUE angoli della regione, non solo Firenze.
          #
          # Il grafo si costruisce per tessere e non e' pronto tutto insieme:
          # con una sonda sola, su un tratto del centro di Firenze, si
          # dichiarava "pronto" un grafo che copriva una frazione della
          # Toscana. Il 15/09/2026 e' costato il 56% di tracce aderite invece
          # del 95: tutto il sud e la costa erano ancora tessere mancanti.
          PROBES='43.7696,11.2558,43.7712,11.2486|43.3188,11.3308,43.3204,11.3260|42.7635,11.1128,42.7650,11.1080|44.0367,10.1400,44.0382,10.1352|43.4633,11.8797,43.4648,11.8749'
          probe_ok() {
            IFS=',' read -r aLat aLon bLat bLon <<< "$1"
            curl -s -m 5 -X POST localhost:8002/trace_route \
                 -d "{\"shape\":[{\"lat\":$aLat,\"lon\":$aLon},{\"lat\":$bLat,\"lon\":$bLon}],\"costing\":\"bus\"}" \
                 | grep -q '"trip"'
          }
          VALHALLA_URL=""
          passed=0
          IFS='|' read -ra P <<< "$PROBES"
          # Fino a venticinque minuti. Il grafo dell'intera Toscana ci mette
          # una decina di minuti a rispondere su Firenze e di piu' per il
          # resto; il job ha un'ora, quindi c'e' margine.
          for i in $(seq 1 150); do
            passed=0
            for probe in "${P[@]}"; do
              probe_ok "$probe" && passed=$((passed + 1))
            done
            if [ "$passed" -eq "${#P[@]}" ]; then
              VALHALLA_URL="http://localhost:8002"
              echo "grafo pronto su tutti e cinque gli angoli dopo $((i * 10)) s"
              break
            fi
            sleep 10
          done
          # Scaduto il tempo: un matching parziale e' comunque meglio di
          # nessun matching, perche' ogni traccia che aderisce e' un
          # guadagno suo, indipendente dalle altre.
          if [ -z "$VALHALLA_URL" ] && [ "$passed" -gt 0 ]; then
            VALHALLA_URL="http://localhost:8002"
            echo "::warning::grafo pronto solo su $passed angoli su ${#P[@]}: si procede lo stesso"
          fi
          if [ -n "$VALHALLA_URL" ]; then
            echo "2" > work/overlay.rev
            echo "Valhalla pronto: matching attivo"
            VALHALLA_URL="$VALHALLA_URL" ./gradlew --no-daemon :bundler:matchshapes \
              --console=plain \
              --args="$GITHUB_WORKSPACE/work/gtfs $GITHUB_WORKSPACE/work/gtfs/shapes-matched.txt"
            ls -la work/gtfs/shapes-matched.txt || \
              echo "::warning::sidecar non prodotto: si prosegue con le shape GPS"
            # La revisione dell'overlay segue la qualita' del matching.
            #
            # Attenzione a cosa protegge davvero: la revisione conta solo nel
            # ramo "tutto identico a ieri", dove decide se vale la pena
            # ripubblicare a orari invariati. Quando il feed cambia -- cioe'
            # quasi ogni notte -- si pubblica comunque tutto, e un matching
            # scarso finisce nell'overlay. E' accettabile perche' l'overlay di
            # una notte storta ma con gli orari giusti vale piu' di uno bello
            # e vecchio, ma non e' la garanzia che sembra.
            rate=$(cat work/gtfs/match-rate.txt 2>/dev/null || echo 0)
            echo "tracce aderite: ${rate}%" >> "$GITHUB_STEP_SUMMARY"
            if [ "$rate" -lt 80 ]; then
              echo "1" > work/overlay.rev
              echo "::warning::matching al ${rate}%: l'overlay resta alla revisione bassa"
            fi
          else
            echo "1" > work/overlay.rev
            echo "::warning::Valhalla non pronto entro 15 min: shape GPS, senza matching"
            docker logs valhalla 2>&1 | tail -20 || true
          fi

      # Prima di costruire, non dopo: se il costruttore e' rotto, un bundle
      # sbagliato si riconosce dopo ore di lavoro e a volte non si riconosce
      # affatto. Qui ci sono le regole che il builder applica ai dati —
      # per esempio la pulizia dei nomi delle fermate.
      - name: Test del costruttore
        run: ./gradlew --no-daemon :bundler:test --console=plain

      - name: Costruisci il bundle
        run: |
          ./gradlew --no-daemon :bundler:run --console=plain --args="$GITHUB_WORKSPACE/work/gtfs $GITHUB_WORKSPACE/work/toscana.ftb - $GITHUB_WORKSPACE/work/fragment.json"
          cat work/fragment.json

      - name: Overlay della rete (tippecanoe)
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :bundler:overlay --console=plain --args="$GITHUB_WORKSPACE/work/gtfs $GITHUB_WORKSPACE/work/overlay"
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsqlite3-dev zlib1g-dev >/dev/null
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j"$(nproc)" >/dev/null 2>&1
          T=/tmp/tippecanoe/tippecanoe
          # Due passate con finestre di zoom diverse - le linee esistono da
          # lontano, le fermate solo da vicino - poi tile-join le fonde in un
          # archivio solo. Da z14 in su MapLibre fa overzoom da solo.
          $T -o work/linee.pmtiles -l linee -Z6 -z14 \
             --drop-densest-as-needed --coalesce --reorder --hilbert \
             --force work/overlay/linee.geojsonl
          $T -o work/fermate.pmtiles -l fermate -Z11 -z14 \
             --drop-densest-as-needed --force work/overlay/fermate.geojsonl
          /tmp/tippecanoe/tile-join -o work/rete.pmtiles --force \
             work/linee.pmtiles work/fermate.pmtiles
          ls -la work/*.pmtiles

      - name: Luoghi (geocoding offline da OSM)
        continue-on-error: true
        run: |
          set -euo pipefail
          P=/tmp/toscana.osm.pbf
          mkdir -p work/osm
          # Ogni estrazione e' un doppio filtro dove serve l'AND (osmium non
          # intere seca in un colpo solo "highway E name").
          osmium tags-filter -o work/osm/loc.pbf "$P" n/place
          osmium export -f geojsonseq -o work/osm/localita.geojsonl work/osm/loc.pbf
          osmium tags-filter -o work/osm/hw.pbf "$P" w/highway
          osmium tags-filter -o work/osm/vie.pbf work/osm/hw.pbf w/name
          osmium export -f geojsonseq -o work/osm/vie.geojsonl work/osm/vie.pbf
          osmium tags-filter -o work/osm/poi_all.pbf "$P" \
            nwr/amenity nwr/shop nwr/tourism nwr/leisure nwr/office nwr/healthcare \
            nwr/railway=station,halt
          osmium tags-filter -o work/osm/poi.pbf work/osm/poi_all.pbf nwr/name
          osmium export -f geojsonseq -o work/osm/poi.geojsonl work/osm/poi.pbf
          osmium tags-filter -o work/osm/addr.pbf "$P" nwr/addr:housenumber
          osmium export -f geojsonseq -o work/osm/civici.geojsonl work/osm/addr.pbf
          ls -la work/osm/
          ./gradlew --no-daemon :bundler:places --console=plain \
            --args="$GITHUB_WORKSPACE/work/osm $GITHUB_WORKSPACE/work/luoghi.bin"
          ls -la work/luoghi.bin

      - name: Golden gate, contro i CSV
        run: |
          ./gradlew --no-daemon :bundler:verify --console=plain --args="$GITHUB_WORKSPACE/work/gtfs $GITHUB_WORKSPACE/work/toscana.ftb" | tee work/verify.log
          grep -q "TUTTI I CONTROLLI PASSATI" work/verify.log

      - name: Test di formato
        run: ./gradlew --no-daemon :core-routing:test --console=plain

      # Gli invarianti del motore dei viaggi, sul bundle appena costruito.
      #
      # I test di :core-routing girano su una rete di prova con quattro
      # fermate: dicono che il motore fa la cosa giusta quando la rete e'
      # quella. Un bundle sbagliato — un profilo con gli offset fuori
      # ordine, un pattern senza fermate — si vede solo su quello vero.
      - name: Invarianti del motore, sul bundle vero
        run: |
          ./gradlew --no-daemon :bundler:raptorcheck --console=plain \
            --args="$GITHUB_WORKSPACE/work/toscana.ftb 120" | tee work/raptor.log
          grep -q "TUTTI GLI INVARIANTI PASSATI" work/raptor.log

      - name: Gate volumetrici contro il build precedente
        env:
          IGNORA_GATE: ${{ inputs.ignora_gate }}
        run: |
          set -euo pipefail
          # L'indice del build precedente. Se non esiste (primo build) i gate
          # relativi si saltano: non c'e' baseline con cui confrontare.
          if ! curl --fail --silent --location -o work/previous.json \
               "https://github.com/${GITHUB_REPOSITORY}/releases/download/dati/index.json"; then
            echo "nessun index.json precedente: primo build, gate saltati"
            exit 0
          fi

          new=work/fragment.json
          old=work/previous.json

          # Se il contenuto non e' cambiato, non si pubblica: e' il
          # "pubblica solo se cambiato" reso possibile dal build deterministico.
          # Ma l'overlay ha una revisione sua (v2 = map matching): a parita'
          # di orari si ripubblica quando la pipeline delle tile e' migliorata,
          # MAI quando e' peggiorata (stanotte senza Valhalla non si butta il
          # matching di ieri).
          oldOverlay=$(jq -r '.overlayUrl // empty' $old)
          oldRev=0
          case "$oldOverlay" in
            *-v*.pmtiles) oldRev=$(echo "$oldOverlay" | sed -E 's/.*-v([0-9]+)\.pmtiles$/\1/');;
          esac
          newRev=$(cat work/overlay.rev)
          # Anche i luoghi contano: OSM cambia per conto suo, e un indice
          # nuovo va pubblicato pure a orari identici.
          oldPlaces=$(jq -r '.placesSha256 // empty' $old)
          newPlaces=""
          [ -f work/luoghi.bin ] && newPlaces=$(sha256sum work/luoghi.bin | cut -d' ' -f1)
          if [ "$(jq -r .buildId $new)" = "$(jq -r .buildId $old)" ] &&
             [ -n "$oldOverlay" ] && [ "$oldRev" -ge "$newRev" ] &&
             { [ -z "$newPlaces" ] || [ "$newPlaces" = "$oldPlaces" ]; }; then
            echo "skip=true" >> "$GITHUB_ENV"
            echo "tutto identico a ieri (buildId, overlay v$oldRev, luoghi): niente da pubblicare"
            exit 0
          fi

          fail=0
          # Gate 2, volumetria. Le soglie sono ASIMMETRICHE, e non per
          # comodita': le due direzioni vogliono dire cose diverse.
          #
          # Un feed che si RESTRINGE e' il sintomo di un guasto - download
          # troncato, parse parziale, calendario letto male - e il danno e'
          # silenzioso: l'app direbbe "nessun passaggio" invece di dare
          # errore. Li' si sta stretti.
          #
          # Un feed che CRESCE, no. Il 15 settembre 2026 l'origine ha
          # pubblicato 28.780 -> 33.930 fermate, 755 -> 946 linee e 187.394 ->
          # 287.675 corse: e' l'inizio dell'anno scolastico, e sono le corse
          # degli studenti che tornano. Il gate a +-15% l'ha bloccato per
          # sette notti di fila, e per sette giorni l'app ha mostrato gli
          # orari di settembre senza i bus della scuola. Un cancello che
          # scambia la normalita' per un guasto fa piu' danno del guasto.
          #
          # Il tetto in su resta perche' serve ancora a qualcosa di preciso:
          # intercettare una duplicazione (un bug che raddoppia le corse fa
          # esattamente +100%). E il golden gate, che ha gia' ricalcolato
          # tutte le risposte rileggendo i CSV, e' passato prima di arrivare
          # qui: qui non si verifica la correttezza, si verifica la
          # plausibilita' della FONTE.
          for field in stops:10:50 routes:10:50 trips:10:80; do
            name=${field%%:*}; rest=${field#*:}
            maxDown=${rest%%:*}; maxUp=${rest#*:}
            a=$(jq -r ".$name" $old); b=$(jq -r ".$name" $new)
            if [ "$a" -gt 0 ]; then
              delta=$(( (b - a) * 100 / a ))
              echo "$name: $a -> $b (${delta}%)"
              if [ $delta -lt -$maxDown ]; then
                echo "::error::$name calato del $((-delta))%: oltre il ${maxDown}% in meno"; fail=1
              elif [ $delta -gt $maxUp ]; then
                echo "::error::$name cresciuto del ${delta}%: oltre il ${maxUp}% in piu'"; fail=1
              elif [ $delta -gt 15 ] || [ $delta -lt -5 ]; then
                # Dentro le soglie ma fuori dall'ordinario: si pubblica, e lo
                # si dice. Una crescita cosi' e' quasi sempre un cambio
                # d'orario vero, ma va guardata.
                echo "::notice::$name variato del ${delta}%: dentro le soglie, ma vale un'occhiata"
              fi
            fi
          done

          # Gate 3, corse per giorno della settimana: entro +-20% rispetto
          # allo STESSO GIORNO del build precedente. Intercetta "il feed e'
          # valido ma lunedi' ha zero corse". Lo sfasamento fra le due
          # finestre non si assume (il primo tentativo assumeva "un giorno" e
          # un semplice ri-run sullo stesso feed confrontava il sabato con la
          # domenica): si calcola dalle date di inizio dichiarate.
          oldFrom=$(jq -r .validFrom $old)
          newFrom=$(jq -r .validFrom $new)
          days=$(( ( $(date -u -d "$newFrom" +%s) - $(date -u -d "$oldFrom" +%s) ) / 86400 ))
          # `tripsActivePerDay[d]` sono le corse attive al giorno d DOPO
          # validFrom, non di un giorno della settimana: per confrontare
          # lunedi' con lunedi' si sfasa. E lo sfasamento si prende modulo 7,
          # perche' sette giorni dopo e' lo stesso giorno della settimana.
          #
          # Senza il modulo, questo gate era spento proprio quando serviva:
          # l'origine ripubblica il feed OGNI SETTIMANA, quindi lo sfasamento
          # era quasi sempre 7, cioe' "fuori scala", e il controllo si
          # saltava da se'. Nei log delle ultime sette notti c'e' sempre la
          # stessa riga: "sfasamento fuori scala, gate settimanale saltato".
          offset=$(( days % 7 ))
          echo "finestre: $oldFrom -> $newFrom ($days giorni, sfasamento $offset)"
          if [ "$days" -lt 0 ] || [ "$days" -gt 60 ]; then
            echo "::warning::finestre troppo distanti ($days giorni): gate settimanale saltato"
            exit $fail
          fi
          for d in 0 1 2 3 4 5 6; do
            a=$(jq -r ".tripsActivePerDay[$(( (d + offset) % 7 ))] // empty" $old)
            b=$(jq -r ".tripsActivePerDay[$d] // empty" $new)
            if [ -n "$a" ] && [ -n "$b" ] && [ "$a" -gt 0 ]; then
              delta=$(( (b - a) * 100 / a ))
              echo "giorno $d: $a -> $b (${delta}%)"
              # Stessa asimmetria del gate volumetrico, e per lo stesso
              # motivo: un giorno che si svuota e' un guasto, un giorno che si
              # riempie e' settembre.
              if [ $delta -lt -20 ]; then
                echo "::error::corse del giorno $d calate del $((-delta))%: oltre il 20% in meno"; fail=1
              elif [ $delta -gt 80 ]; then
                echo "::error::corse del giorno $d cresciute del ${delta}%: oltre l'80% in piu'"; fail=1
              fi
            fi
          done

          if [ "$fail" -ne 0 ] && [ "${IGNORA_GATE:-false}" = "true" ]; then
            echo "::warning::gate non passati, ma si pubblica lo stesso su richiesta esplicita"
            echo "### Gate ignorati a mano" >> "$GITHUB_STEP_SUMMARY"
            echo "I numeri qui sopra non hanno passato i controlli; la pubblicazione e' stata forzata da chi ha avviato il job." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit $fail

      - name: Pubblica sulla release dati
        if: env.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          buildId=$(jq -r .buildId work/fragment.json)
          sha=$(sha256sum work/toscana.ftb | cut -d' ' -f1)
          bytes=$(stat -c%s work/toscana.ftb)
          asset="toscana-${buildId}.ftb.gz"
          gzip -9 -c work/toscana.ftb > "work/$asset"
          gzBytes=$(stat -c%s "work/$asset")
          # Il nome porta anche la revisione della pipeline delle tile
          # (v2 = map matching): un URL nuovo quando cambia il contenuto,
          # cosi' cache e memoizzazioni dell'app non servono mai byte vecchi.
          overlayAsset="rete-${buildId}-v$(cat work/overlay.rev).pmtiles"
          cp work/rete.pmtiles "work/$overlayAsset"

          # I luoghi viaggiano col nome del loro contenuto: cambiano quando
          # cambia OSM, non quando cambia il feed.
          placesAsset="__nessuno__"
          if [ -f work/luoghi.bin ]; then
            placesSha=$(sha256sum work/luoghi.bin | cut -d' ' -f1)
            placesAsset="luoghi-${placesSha:0:12}.bin.gz"
            gzip -9 -c work/luoghi.bin > "work/$placesAsset"
          fi

          # L'index.json che l'app scarica: url, sha256 del file DECOMPRESSO
          # (l'app verifica dopo il gunzip), e i conteggi per i gate di domani.
          # Il nome dell'asset porta il buildId: un'app a meta' download del
          # bundle di ieri non riceve mai byte diversi da quelli che il suo
          # indice le ha promesso.
          jq --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/dati/$asset" \
             --arg sha "$sha" \
             --arg overlay "https://github.com/${GITHUB_REPOSITORY}/releases/download/dati/$overlayAsset" \
             --argjson bytes "$gzBytes" \
             --argjson rawBytes "$bytes" \
             '. + {url: $url, sha256: $sha, bytes: $bytes, rawBytes: $rawBytes, overlayUrl: $overlay}' \
             work/fragment.json > work/index.json
          if [ -f "work/$placesAsset" ]; then
            jq --arg purl "https://github.com/${GITHUB_REPOSITORY}/releases/download/dati/$placesAsset" \
               --arg psha "$placesSha" \
               --argjson pbytes "$(stat -c%s "work/$placesAsset")" \
               --argjson prawBytes "$(stat -c%s work/luoghi.bin)" \
               '. + {placesUrl: $purl, placesSha256: $psha, placesBytes: $pbytes, placesRawBytes: $prawBytes}' \
               work/index.json > work/index2.json && mv work/index2.json work/index.json
          fi
          cat work/index.json

          # La release `dati` e' fissa: si aggiungono asset e si aggiorna l'indice.
          if ! gh release view dati >/dev/null 2>&1; then
            gh release create dati --title "Dati orari" \
              --notes "Bundle orari rigenerato ogni notte dal feed CC-BY della Regione Toscana. Non e' una release dell'app."
          fi
          # Prima i dati, poi l'indice: l'indice e' lo switch atomico.
          gh release upload dati "work/$asset" --clobber
          gh release upload dati "work/$overlayAsset" --clobber
          if [ -f "work/$placesAsset" ]; then
            gh release upload dati "work/$placesAsset" --clobber
          fi
          gh release upload dati work/index.json --clobber
          echo "pubblicato buildId=$buildId ($gzBytes byte bundle, $(stat -c%s work/$overlayAsset) byte overlay)"

          # Pulizia: si tengono 3 asset per tipo, per le app rimaste su un
          # indice vecchio. I buildId sono hash, quindi l'ordine per nome
          # NON e' cronologico: gli asset appena pubblicati si escludono
          # esplicitamente, o la "pulizia" potrebbe colpire proprio loro.
          # Un fallimento qui non annulla la pubblicazione — e siccome un
          # grep che filtra tutto esce 1, qui pipefail e -e si spengono.
          set +e
          set +o pipefail
          for pattern in '^toscana-.*\.ftb\.gz$' '^rete-.*\.pmtiles$' '^luoghi-.*\.bin\.gz$'; do
            gh release view dati --json assets -q '.assets[].name' \
              | grep "$pattern" | grep -v -F "$asset" | grep -v -F "$overlayAsset" \
              | grep -v -F "$placesAsset" \
              | sort | head -n -2 \
              | while read -r old; do
                  echo "rimuovo asset vecchio: $old"
                  gh release delete-asset dati "$old" --yes || true
                done
          done
